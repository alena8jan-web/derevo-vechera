<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Дерево вечера</title>
<style>
:root{--bg:#1c1714;--ink:#f4ece3;--muted:#cbbba8;--line:#4a3d33;--card:#312821;--btn:#241e1a;--acc:#c9844a;--acc2:#e0a36a}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:560px;margin:auto;padding:22px 16px 40px}
.k{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--acc2);font-family:sans-serif}
h1{font-weight:400;font-size:32px;margin:6px 0 4px}
.sub{color:var(--muted);font-size:15px;line-height:1.4}
.bar{display:flex;gap:5px;margin:16px 0}
.dot{height:5px;flex:1;border-radius:99px;background:#3c322b}
.dot.on{background:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;overflow:hidden}
.artbtn{display:block;width:calc(100% + 36px);margin:-18px -18px 14px;padding:0;border:0;background:#1a1512;position:relative}
.art{width:100%;height:220px;object-fit:cover;object-position:center 20%;display:block}
.artbtn:after{content:"открыть целиком";position:absolute;right:10px;bottom:8px;background:rgba(28,23,20,.72);color:#f4ece3;font:12px sans-serif;padding:4px 8px;border-radius:99px}
.full{position:fixed;inset:0;z-index:30;background:rgba(12,9,7,.94);display:flex;align-items:center;justify-content:center;padding:16px}
.full[hidden]{display:none}
.full img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.full button{position:absolute;top:14px;right:14px;background:#241e1a;color:#f4ece3;border:1px solid #56483c;border-radius:12px;padding:10px 14px;font-family:sans-serif}
.q{font-size:26px;line-height:1.25;margin:0 0 14px}
button{font:inherit;cursor:pointer}
.ch{display:block;width:100%;text-align:left;background:var(--btn);color:var(--ink);border:1px solid #56483c;border-radius:16px;padding:16px 14px;margin:0 0 10px;font-size:18px}
.ch small{display:block;color:var(--muted);font-size:13px;margin-top:4px;font-family:sans-serif}
.alarm{display:block;width:100%;margin-top:6px;background:#6e2c24;color:#f6d7d1;border:1px solid #a85a4e;border-radius:16px;padding:14px;font-size:16px;font-family:sans-serif;letter-spacing:.04em}
.row{display:flex;gap:8px;margin-top:12px}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-family:sans-serif;font-size:14px}
.act{font-size:30px;line-height:1.2;margin:6px 0 8px}
.note{color:var(--muted);font-size:16px}
.tag{display:inline-block;background:#4a3424;color:var(--acc2);border-radius:99px;padding:4px 10px;font-size:12px;font-family:sans-serif;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<p class="k">Саша и Алёна</p>
<h1>Дерево вечера</h1>
<p class="sub">Один ведёт вопросы. 10 секунд. Молчите — верхняя кнопка. Красная кнопка — запас, который точно работает.</p>
<div class="bar" id="bar"></div>
<div class="card" id="card"></div>
</div>
<div class="full" id="full" hidden onclick="closeArt()">
<img id="fullimg" alt="">
<button type="button" onclick="closeArt()">Закрыть</button>
</div>
<script>
const ART={
start:"art/door.jpg",place:"art/kitchen.jpg",energy:"art/sofa.jpg",side:"art/board.jpg",

screenp:"art/arcade.jpg",noscreen:"art/cafe.jpg",rest:"art/massage.jpg",sam:"art/knives.jpg",
body:"art/dance.jpg",hands:"art/kitchen.jpg",talk:"art/pottery.jpg",watch:"art/sofa.jpg",
plot:"art/stars.jpg",bg:"art/cafe.jpg",game:"art/arcade.jpg",one:"art/board.jpg",quiz:"art/karaoke.jpg",
own:"art/hotel.jpg",make:"art/kitchen.jpg",par:"art/massage.jpg",parmove:"art/dance.jpg",
motor:"art/lego.jpg",partalk:"art/arcade.jpg",near:"art/costumes.jpg",dist:"art/moto.jpg",
voice:"art/cafe.jpg",dscr:"art/karaoke.jpg",dphoto:"art/photohunt.jpg",ride:"art/bikes.jpg",
pace:"art/forest.jpg",aim:"art/kayak.jpg",job:"art/badminton.jpg",sport:"art/bowling.jpg",
class:"art/pottery.jpg",spot:"art/banya.jpg",air:"art/sunset.jpg",sit:"art/dawn.jpg",
food:"art/fire.jpg",bench:"art/museum.jpg",walk:"art/photohunt.jpg",feet:"art/forest.jpg",car:"art/moto.jpg"

const RESULT={
"Обучение за просмотром":"art/sofa.jpg","Фотосет костюмчиков":"art/costumes.jpg","Глаза в глаза":"art/hotel.jpg",
"Игрушки":"art/lego.jpg","Массаж":"art/massage.jpg","Чувственный фокус":"art/hotel.jpg",
"Танцевальная связка":"art/dance.jpg","Тренировка":"art/dance.jpg","Медленные танцы":"art/dance.jpg",
"Метание ножей":"art/knives.jpg","Фланкировка шашкой":"art/knives.jpg","Конструктор":"art/lego.jpg",
"Кухня":"art/kitchen.jpg","Рисунок персонажа":"art/board.jpg","Фильм":"art/sofa.jpg","Аниме":"art/stars.jpg",
"Документалка":"art/stars.jpg","Подкаст":"art/cafe.jpg","Рилсы":"art/sofa.jpg","Лоу-фай":"art/cafe.jpg",
"Настолка":"art/board.jpg","Угадай песню":"art/karaoke.jpg","Ютуб-квиз":"art/arcade.jpg",
"Совместная компьютерная игра":"art/arcade.jpg","Саша играет, Алёна смотрит":"art/arcade.jpg",
"Каждый в своей игре":"art/board.jpg","Озвучка фильма":"art/karaoke.jpg","История с ИИ":"art/sofa.jpg",
"Ютуб-урок и сразу проба":"art/kitchen.jpg","Тренировка full-body":"art/dance.jpg",
"Конструктор и ассистент":"art/lego.jpg","Инструмент и другое дело рядом":"art/kitchen.jpg",
"Алёна танцует, Саша смотрит":"art/dance.jpg","Фото каждый час":"art/costumes.jpg","Домашние дела":"art/kitchen.jpg",
"Мягкие вопросы":"art/cafe.jpg","Чтение вслух":"art/hotel.jpg","Кадр каждый час":"art/photohunt.jpg",
"Бадминтон":"art/badminton.jpg","Большой теннис":"art/badminton.jpg","Боулинг":"art/bowling.jpg",
"Бильярд":"art/billiards.jpg","Батутный парк":"art/tramp.jpg","Велик или ролики":"art/bikes.jpg",
"Коньки":"art/ice.jpg","Воркаут":"art/tramp.jpg","Каяк или сап":"art/kayak.jpg","Аэротруба":"art/tramp.jpg",
"Каток":"art/ice.jpg","Гончарная мастерская":"art/pottery.jpg","Фото-охота":"art/photohunt.jpg",
"Баня":"art/banya.jpg","Музей":"art/museum.jpg","Планетарий":"art/stars.jpg","Караоке или бар":"art/karaoke.jpg",
"Дегустация":"art/cafe.jpg","Двойное свидание":"art/karaoke.jpg","Кафе":"art/cafe.jpg",
"Костёр или шашлыки":"art/fire.jpg","Пикник":"art/fire.jpg","Лавочка":"art/sunset.jpg",
"Закат":"art/sunset.jpg","Вода":"art/kayak.jpg","Прогулка":"art/forest.jpg","Ботанический сад":"art/forest.jpg",
"Рассвет":"art/dawn.jpg","Ночная автопрогулка":"art/moto.jpg","Однодневка в другой город":"art/bikes.jpg",
"Ночь в отеле своего города":"art/hotel.jpg","Рисунок персонажа по описанию":"art/board.jpg"
};
function artFor(){const id=stack[stack.length-1];return ART[id]||"art/cover.jpg";}
function fig(src){return '<button type="button" class="artbtn" onclick="openArt(this.dataset.src)" data-src="'+src+'"><img class="art" src="'+src+'" alt=""></button>';}
function openArt(src){const f=document.getElementById("full");document.getElementById("fullimg").src=src;f.hidden=false;}
function closeArt(){document.getElementById("full").hidden=true;}
function pack(q,items){return {q,pick:items};}
const N={
start:{q:"Вместе или на расстоянии?",o:[["Вместе","place"],["На расстоянии","dist"]]},
place:{q:"Дом или улица?",o:[["Дом","energy"],["Улица","ride"]]},
energy:{q:"Активно или лениво?",o:[["Активно","side"],["Лениво","side"]]},
side:{q:"Друг с другом или параллельно?",o:[["Друг с другом","vec"],["Параллельно","par"]]},
vec:{q:"Движение или разговор?",o:[["Движение","move"],["Разговор","talk"]]},
move:{q:"Тактильность или результат самурая?",o:[["Тактильность","touch"],["Результат самурая","sam"]]},
touch:{q:"Игра или расслабление?",o:[["Игра","playt"],["Расслабление","rest"]]},
playt:{q:"Экран или без экрана?",o:[["Экран","screenp"],["Без экрана","noscreen"]]},
screenp:pack("Выберите дело",[["Обучение за просмотром","Короткий ролик и сразу повтор."],["Фотосет костюмчиков","Не для инсты. В общую группу."]]),
noscreen:pack("Выберите дело",[["Глаза в глаза","Три минуты, без разговора."],["Игрушки","Одна, без меню из десяти."]]),
rest:pack("Выберите дело",[["Массаж","Без таймера."],["Чувственный фокус","Одна зона, медленно."]]),
sam:{q:"Двигаемся или делаем руками?",o:[["Двигаемся","body"],["Делаем руками","hands"]]},
body:pack("Выберите дело",[["Танцевальная связка","Одна песня."],["Тренировка","Оба, без таймера."],["Медленные танцы","Три песни, без схемы."],["Метание ножей","Мишень, если место позволяет."],["Фланкировка шашкой","Короткая форма."]]),
hands:pack("Выберите дело",[["Конструктор","Лего, пазл, одна цель."],["Кухня","Готовка в четыре руки, одно блюдо."],["Рисунок персонажа","Один описывает, второй рисует."]]),
talk:{q:"Смотрим, играем или делаем?",o:[["Смотрим","watch"],["Играем","game"],["Делаем","make"]]},
watch:{q:"Вникаем или фон?",o:[["Вникаем","plot"],["Фон","bg"]]},
plot:pack("Выберите дело",[["Фильм","Два названия, жребий."],["Аниме","Одна серия или фильм."],["Документалка","Одна, с паузой если надо."]]),
bg:pack("Выберите дело",[["Подкаст","Один выпуск."],["Рилсы","Один телефон на двоих."],["Лоу-фай","Фоном, без ленты."]]),
game:{q:"В одну игру или каждый в свою?",o:[["В одну игру","one"],["Каждый в свою","own"]]},
one:{q:"Что из этого?",o:[["Настолка",{t:"Настолка",n:"Одна партия."}],["Угадай песню",{t:"Угадай песню",n:"По пять фрагментов."}],["Квиз или играем вместе","quiz"]]},
quiz:{q:"Квиз или играем вместе?",o:[["Квиз",{t:"Ютуб-квиз",n:"Одна ссылка на двоих."}],["Играем вместе",{t:"Совместная компьютерная игра",n:"Кооп, одна сессия."}]]},
own:{q:"Один играет, второй смотрит — или оба в своей?",o:[["Один играет, второй смотрит",{t:"Саша играет, Алёна смотрит",n:"Можно комментировать."}],["Оба в своей",{t:"Каждый в своей игре",n:"Одна комната."}]]},
make:pack("Выберите дело",[["Озвучка фильма","Десять минут сцены."],["История с ИИ","По очереди, один ход каждый."],["Ютуб-урок и сразу проба","20 минут и стоп."]]),
par:{q:"Движение или разговор?",o:[["Движение","parmove"],["Разговор","partalk"]]},
parmove:{q:"Тренировка full-body или мелкая моторика?",o:[["Full-body",{t:"Тренировка full-body",n:"Тренируются оба. Без таймера."}],["Мелкая моторика","motor"]]},
motor:pack("Выберите дело",[["Конструктор и ассистент","Можно комментировать."],["Инструмент и другое дело рядом","Не обязательно дуэт."]]),
partalk:{q:"Геймер и зритель или просто рядом?",o:[["Геймер и зритель",{t:"Саша играет, Алёна смотрит",n:"Рядом, не в другой комнате."}],["Просто рядом","near"]]},
near:pack("Выберите дело",[["Алёна танцует, Саша смотрит","Одна связка или три песни."],["Фото каждый час","В общую группу. Не для инсты."],["Домашние дела","Короткий список на двоих."]]),
dist:{q:"Голос, экран или фото?",o:[["Голос","voice"],["Экран","dscr"],["Фото","dphoto"]]},
voice:pack("Выберите дело",[["Мягкие вопросы","По одной карточке."],["Чтение вслух","Звонок, одна глава."],["Угадай песню","Голосовые."]]),
dscr:{q:"Квиз, чужой сюжет или свой?",o:[["Квиз",{t:"Ютуб-квиз",n:"Одна ссылка."}],["Чужой сюжет",{t:"Озвучка фильма",n:"Онлайн."}],["Свой",{t:"История с ИИ",n:"Ход через ход."}]]},
dphoto:{q:"Кадр каждый час или рисунок?",o:[["Кадр каждый час",{t:"Фото каждый час",n:"Рабочий день или выходной, в группу."}],["Рисунок",{t:"Рисунок персонажа по описанию",n:"Фото результата в группу."}]]},
ride:{q:"Кружим на районе или едем сквозь мглистых гор хребет?",o:[["Кружим на районе","pace"],["Хребет","pace"]]},
pace:{q:"Активно или спокойно?",o:[["Активно","aim"],["Спокойно","aim"]]},
aim:{q:"Занятие с целью или атмосфера?",o:[["Занятие","job"],["Атмосфера","air"]]},
job:{q:"Спорт, мастер-класс или место?",o:[["Спорт","sport"],["Мастер-класс","class"],["Место","spot"]]},
sport:pack("Выберите дело",[["Бадминтон","Один сет."],["Большой теннис","Час."],["Боулинг","Одна дорожка."],["Бильярд","Одна партия."],["Батутный парк","40 минут."],["Велик или ролики","Маршрут."],["Коньки","Каток, если открыт."],["Воркаут","20 минут, оба."],["Каяк или сап","Ближняя вода."],["Аэротруба","Один полёт каждому."],["Каток","Час."]]),
class:pack("Выберите дело",[["Гончарная мастерская","Одна чашка на двоих."],["Метание ножей","Зал или клуб."],["Фланкировка шашкой","Площадка, где можно."],["Фото-охота","20 кадров, не для ленты."]]),
spot:pack("Выберите дело",[["Баня","Без программы на вечер."],["Музей","Один зал."],["Планетарий","Один сеанс."],["Караоке или бар","Одно место."],["Дегустация","Три позиции."],["Двойное свидание","Одно место."]]),
air:{q:"Сидеть или идти?",o:[["Сидеть","sit"],["Идти","walk"]]},
sit:{q:"Еда или просто место?",o:[["Еда","food"],["Просто место","bench"]]},
food:pack("Выберите дело",[["Кафе","Ближайшее, если район. Незнакомое, если хребет."],["Костёр или шашлыки","Одно место."],["Пикник","Еда с собой."]]),
bench:pack("Выберите дело",[["Лавочка","Никуда не спешим."],["Закат","Одна точка."],["Вода","Набережная или смотровая."]]),
walk:{q:"Ноги или машина?",o:[["Ноги","feet"],["Машина","car"]]},
feet:pack("Выберите дело",[["Прогулка","Район или туристы в своём городе."],["Ботанический сад","Один маршрут."],["Рассвет","Одна точка, кофе с собой."]]),
car:pack("Выберите дело",[["Ночная автопрогулка","Один круг."],["Однодневка в другой город","Туда и обратно сегодня."],["Ночь в отеле своего города","Без плана на утро."]])
};
let stack=[];
function go(id){stack.push(id);draw();}
function back(){if(stack.length>1){stack.pop();draw();}}
function alarm(){
  const t=BACK[Math.floor(Math.random()*BACK.length)];
  document.getElementById("card").innerHTML='<div class="tag">Красная кнопка</div><div class="act">'+t+'</div><p class="note">Запас, который точно работает. Список потом заменим.</p><div class="row"><button class="ghost" onclick="restart()">Сначала</button></div>';
}
function restart(){stack=["start"];draw();}
function choose(t,n){
  const src=RESULT[t]||artFor();
  document.getElementById("card").innerHTML=fig(src)+'<div class="tag">Дело на сейчас</div><div class="act">'+t+'</div><p class="note">'+n+'</p><div class="row"><button class="ghost" onclick="back()">Назад</button><button class="ghost" onclick="restart()">Сначала</button></div><button class="alarm" onclick="alarm()">ALARM · запас</button>';
}
function draw(){
  const node=N[stack[stack.length-1]];
  const bar=document.getElementById("bar");bar.innerHTML="";
  for(let i=0;i<7;i++){const d=document.createElement("div");d.className="dot"+(i<stack.length?" on":"");bar.appendChild(d);}
  const card=document.getElementById("card");
  if(node.t){choose(node.t,node.n);return;}
  if(node.pick){
    card.innerHTML=fig(artFor())+'<div class="q">'+node.q+'</div>'+node.pick.map((o,i)=>'<button class="ch" onclick="fromPack('+i+')">'+o[0]+'</button>').join("")+'<button class="alarm" onclick="alarm()">ALARM · запас</button><div class="row"><button class="ghost" onclick="back()">Назад</button></div>';
    return;
  }
  card.innerHTML=fig(artFor())+'<div class="q">'+node.q+'</div>'+node.o.map((o,i)=>'<button class="ch" onclick="pick('+i+')">'+o[0]+'</button>').join("")+'<button class="alarm" onclick="alarm()">ALARM · запас</button>'+(stack.length>1?'<div class="row"><button class="ghost" onclick="back()">Назад</button></div>':'');
}
function fromPack(i){const o=N[stack[stack.length-1]].pick[i];choose(o[0],o[1]);}
function pick(i){
  const o=N[stack[stack.length-1]].o[i];
  if(typeof o[1]==="string")go(o[1]);
  else choose(o[1].t,o[1].n);
}
restart();
</script>
</body>
</html>
